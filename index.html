<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ডার্ক থিম ওয়েবসাইট</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* নীল এবং কালো কালারের মিশ্রণ */
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1); /* হালকা স্বচ্ছ ব্যাকগ্রাউন্ড */
            backdrop-filter: blur(10px); /* গ্লাস ইফেক্ট */
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 28px;
            color: #00d2ff;
        }
        p {
            line-height: 1.6;
            margin-bottom: 30px;
            color: #d1d1d1;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            background: #00d2ff; /* উজ্জ্বল নীল বাটন */
            color: #000428;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.4s;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }
        .button:hover {
            background: #ffffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>স্বাগতম! 👋</h1>
        <p>I am <b>M D Tamim Hasan</b>। this web page i made with gimini and github</p>
        
        <a href="https://www.facebook.com/profile.php?id=100069694123478" class="button" target="_blank">আমার প্রোফাইল</a>
    </div>

</body>
</html>
