<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার প্রফেশনাল ওয়েবসাইট</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            /* এখানে আপনি পছন্দমতো ব্যাকগ্রাউন্ড কালার পরিবর্তন করতে পারেন */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #1877f2;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(24, 119, 242, 0.3);
        }
        .button:hover {
            background-color: #145dbf;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>স্বাগতম! 👋</h1>
        <p>আমি <b>M D Tamim Hasan</b>। এটি আমার প্রথম ওয়েবসাইট যা আমি GitHub Pages দিয়ে তৈরি করেছি।</p>
        
        <a href="https://www.facebook.com/profile.php?id=100069694123478" class="button" target="_blank">আমার ফেসবুক প্রোফাইল</a>
    </div>

</body>
</html>
