<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার প্রফেশনাল ওয়েবসাইট</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #1877f2;
        }
        p {
            color: #555;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #1877f2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .button:hover {
            background-color: #145dbf;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>স্বাগতম! 👋</h1>
        <p>আমি <b>hsaimon385</b>। এটি আমার প্রথম প্রফেশনাল ওয়েব পেজ যা আমি GitHub Pages দিয়ে তৈরি করেছি।</p>
        <a href="#" class="button">আমার প্রোফাইল দেখুন</a>
    </div>
</body>
</html>
