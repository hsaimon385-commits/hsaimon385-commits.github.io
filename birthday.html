<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ জন্মদিন!</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #000428, #004e92);
            height: 100vh; display: flex;
            justify-content: center; align-items: center;
            font-family: 'Arial', sans-serif; overflow: hidden; color: white;
        }
        /* এন্ট্রান্স স্ক্রিন */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000428; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .open-btn {
            padding: 15px 40px; font-size: 20px; background: #ff007f;
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px #ff007f; animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        /* মেইন কার্ড */
        .container {
            text-align: center; background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); padding: 40px;
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h1 { font-size: 40px; color: #ff007f; text-shadow: 0 0 15px #ff007f; }
        .balloon {
            position: absolute; bottom: -100px; font-size: 30px;
            animation: fly 6s linear infinite; opacity: 0.7;
        }
        @keyframes fly {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="margin-bottom: 20px;">আপনার জন্য একটি সারপ্রাইজ আছে!</h2>
        <button class="open-btn" onclick="startEverything()">সারপ্রাইজটি খুলুন 🎁</button>
    </div>

    <div id="mainContent" style="display: none;">
        <div class="balloon" style="left: 10%; animation-delay: 0s;">🎈</div>
        <div class="balloon" style="left: 40%; animation-delay: 2s;">🎈</div>
        <div class="balloon" style="left: 70%; animation-delay: 4s;">🎈</div>
        <div class="balloon" style="left: 90%; animation-delay: 1s;">🎈</div>

        <div class="container">
            <div style="font-size: 80px;">🎂</div>
            <h1>শুভ জন্মদিন! 🥳</h1>
            <p style="font-size: 20px;">তোমার আগামী দিনগুলো অনেক সুখের হোক!</p>
            <div style="font-size: 40px;">✨🎁🎊</div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.youtube.com/watch?v=c968eqcH3c0&list=RDc968eqcH3c0&start_radio=1&pp=ygUZaGFwcHkgYmlydGhkYXkgc29uZyBwaWFub6AHAQ%3D%3D" type="audio/mpeg">
    </audio>

    <script>
        function startEverything() {
            var music = document.getElementById("bgMusic");
            // গান শুরু হবে
            music.play();
            // ওভারলে মুছে যাবে
            document.getElementById("overlay").style.display = "none";
            // মেইন কার্ড দেখাবে
            document.getElementById("mainContent").style.display = "block";
        }
    </script>
</body>
</html>
